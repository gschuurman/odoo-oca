name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/odoo-oca

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: odoo-oca:ci

      - name: Smoke test (install all modules + OCA module tests)
        run: ./smoke-test.sh odoo-oca:ci

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push 20.0-<date>-<sha>
        if: github.event_name != 'pull_request'
        run: |
          tag="20.0-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          docker tag odoo-oca:ci "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag")
          echo "Pushed $IMAGE:$tag (${ref#*@})" | tee -a "$GITHUB_STEP_SUMMARY"
